name: extension-test

on:
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/extension-test.yml'
  push:
    paths:
      - 'extension/**'
      - '.github/workflows/extension-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix extension ci
      - run: npm --prefix extension test
